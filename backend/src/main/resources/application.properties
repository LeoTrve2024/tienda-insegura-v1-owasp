# =====================================================================
# TIENDA INSEGURA v1 - VULNERABLE A PROPÓSITO
# SOLO PARA LABORATORIO LOCAL AUTORIZADO
# =====================================================================

server.port=8080

# ---------------------------------------------------------------------
# A02: Security Misconfiguration
# Se permiten variables de entorno para que Docker funcione, pero se
# conservan valores por defecto débiles y públicos a propósito.
# ---------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/tienda_insegura}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tienda_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tienda_pass_123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# A02: logs detallados que pueden revelar consultas y datos sensibles.
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.SQL=DEBUG

# Los scripts son idempotentes para poder ejecutarse al iniciar.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------
# A02: Actuator completamente expuesto sin autenticación.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always

# ---------------------------------------------------------------------
# A02/A10: modo debug y stacktraces expuestos.
# ---------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
debug=true

# ---------------------------------------------------------------------
# A07/A04: secreto JWT débil y conocido.
# ---------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:clave-super-secreta-insegura-2025}

# A08: subida de archivos con límites excesivos y sin validación real.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
