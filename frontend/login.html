<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Tienda Insegura</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__brand">
        <span class="navbar__logo">⚡</span>
        Tienda Insegura
      </a>
      <div class="navbar__actions">
        <a href="index.html" class="btn btn--ghost btn--sm">← Volver</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1 class="auth-card__title heading-serif">Bienvenido</h1>
      <p class="auth-card__subtitle">Ingresa a tu cuenta para continuar</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn--primary btn--block btn--lg" id="login-btn">
          Ingresar
        </button>
      </form>

      <div class="auth-card__footer">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
