<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — Tienda Insegura</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__brand">
        <span class="navbar__logo">⚡</span>
        Tienda Insegura
      </a>
      <div class="navbar__actions">
        <a href="login.html" class="btn btn--ghost btn--sm">Ya tengo cuenta</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1 class="auth-card__title heading-serif">Crear cuenta</h1>
      <p class="auth-card__subtitle">Únete y empieza a comprar hoy</p>

      <form id="registro-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Nombre completo</label>
          <input type="text" id="fullName" class="form-input" placeholder="Juan Pérez" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input type="text" id="username" class="form-input" placeholder="jperez" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>

        <!-- A01: campo role expuesto en el formulario (vulnerabilidad intencional) -->
        <details class="advanced-options">
          <summary>Opciones avanzadas (desarrollo)</summary>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="role">Rol de usuario</label>
            <select id="role" class="form-select">
              <option value="USER">USER — Cliente</option>
              <option value="ADMIN">ADMIN — Administrador</option>
            </select>
            <span class="form-hint">⚠️ Este campo no debería estar disponible en producción</span>
          </div>
        </details>

        <div id="registro-error" class="form-error" style="display:none;margin-top:1rem"></div>
        <button type="submit" class="btn btn--primary btn--block btn--lg" id="registro-btn" style="margin-top:1.5rem">
          Crear cuenta
        </button>
      </form>

      <div class="auth-card__footer">
        ¿Ya tienes cuenta? <a href="login.html">Ingresa aquí</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/registro.js"></script>
</body>
</html>
