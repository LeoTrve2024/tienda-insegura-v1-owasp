server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # V1: se conserva server_tokens para ilustrar exposición de versión.
    # En la V2 se desactivará y se agregará HTTPS/TLS.
    server_tokens on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El proxy usa el nombre del servicio Docker, no host.docker.internal.
    # Así el stack completo funciona igual en Windows, Linux y macOS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos publicados deliberadamente en la V1.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Actuator expuesto deliberadamente en la V1.
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
